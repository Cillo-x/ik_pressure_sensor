[flake8]
# Keep this in sync with ROS 2's ament_flake8 configuration: 99 columns and the
# same ignore list, so ``python -m flake8 .`` locally reaches the same verdict
# as ``colcon test`` in CI.  Plugin specific options (import-order-style) are
# deliberately not set here so that a bare flake8 install can still read this
# file.
max-line-length = 99
# ament_flake8 passes this on the command line; setting it here makes a plain
# ``python -m flake8 .`` reach the same import-order verdict.  Harmless when
# flake8-import-order is not installed.
import-order-style = google
extend-ignore =
    B902
    C816
    D100
    D101
    D102
    D103
    D104
    D105
    D106
    D107
    D203
    D212
    D404
    I202
exclude =
    .git
    __pycache__
    build
    install
    log

[develop]
script_dir=$base/lib/ik_pressure_sensor
[install]
install_scripts=$base/lib/ik_pressure_sensor
