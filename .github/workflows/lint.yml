name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-style:
    # This name is what branch protection shows as the required status check.
    name: Python style
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: python -m pip install -r requirements-dev.txt

      # Rules (99 columns, ament ignore list, google import order) live in
      # setup.cfg, so colcon test and this job cannot disagree.
      - name: flake8
        run: python -m flake8 .

      # Mirrors ament_pep257's default "ament" convention. Keep in sync with
      # the --ignore list in test/test_pep257.py.
      - name: pydocstyle
        run: >-
          python -m pydocstyle
          --match='.*\.py'
          --match-dir='[^\._].*'
          --ignore D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404
          .
